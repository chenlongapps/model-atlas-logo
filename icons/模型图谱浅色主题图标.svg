<svg xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">ModelAtlas — Light app icon</title>
  <desc id="desc">Seven colorful rounded tiles, increasing toward the center and shrinking toward the edges.</desc>
  <defs>
    <linearGradient id="bg-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#fbfcff" />
      <stop offset="100%" stop-color="#f5f7fa" />
    </linearGradient>
  </defs>
  <!-- Square icon background; transparent outside rounded corners -->
  <rect width="1024" height="1024" rx="218" fill="url(#bg-light)" />
  <!-- Seven precisely colored editable vector tiles -->
  <g id="model-tiles">
    <rect x="44" y="487" width="80" height="80" rx="18" fill="#6cbb8b" />
    <rect x="137" y="465" width="110" height="118" rx="22" fill="#e6a08a" />
    <rect x="260" y="434" width="132" height="181" rx="27" fill="#81abef" />
    <rect x="406" y="393" width="206" height="255" rx="34" fill="#717171" />
    <rect x="626" y="433" width="132" height="183" rx="27" fill="#c3c9d0" />
    <rect x="770" y="465" width="110" height="118" rx="22" fill="#7189ff" />
    <rect x="896" y="487" width="80" height="80" rx="18" fill="#ff9863" />
  </g>
</svg>
